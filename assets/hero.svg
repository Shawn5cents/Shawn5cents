<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Shawn Nichols Sr. — Agent Systems and Evaluation Engineer</title>
  <desc id="desc">A dark steel-blue profile hero showing Shawn Nichols Sr. and his focus on agent systems, evaluations, verification, and local inference.</desc>
  <defs>
