  <text x="74" y="103" fill="#87a7bf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="3">SHAWN NICHOLS SR.</text>
  <text x="74" y="164" fill="#f2f6fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="700">Agent systems that can prove</text>
  <text x="74" y="219" fill="#f2f6fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="700">what they did.</text>
